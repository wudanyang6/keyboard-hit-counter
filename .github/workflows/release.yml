name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Test before releasing
        run: swift test

      - name: Package universal .app
        run: make zip

      - name: Verify both architectures are present
        run: lipo -info build/KeyboardHitCounter.app/Contents/MacOS/KeyboardHitCounter

      - name: Write release notes
        run: |
          cat > build/NOTES.md <<'NOTES'
          下载 `KeyboardHitCounter.zip`，解压后把 `KeyboardHitCounter.app` 拖进「应用程序」。

          本产物是 ad-hoc 签名、未经 Apple 公证，首次打开会被 Gatekeeper 拦下。解除隔离标记：

          ```bash
          xattr -dr com.apple.quarantine /Applications/KeyboardHitCounter.app
          ```

          随后在「系统设置 → 隐私与安全性 → 辅助功能」中勾选本应用，菜单栏即开始计数。

          本工具只统计按键次数，不记录按键内容，数据仅存本地。详见 README。
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/KeyboardHitCounter.zip \
            --title "KeyboardHitCounter ${GITHUB_REF_NAME}" \
            --notes-file build/NOTES.md
